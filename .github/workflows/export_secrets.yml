name: Export RAAPS Secrets

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Generate .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_ACCESS_TOKEN: ${{ secrets.HASHNODE_ACCESS_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          REDDIT_SESSION_COOKIE: ${{ secrets.REDDIT_SESSION_COOKIE }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          cat <<EOF > raaps.env
          GEMINI_API_KEY=$GEMINI_API_KEY
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          BSKY_HANDLE=$BSKY_HANDLE
          BSKY_APP_PASSWORD=$BSKY_APP_PASSWORD
          DEVTO_API_KEY=$DEVTO_API_KEY
          HASHNODE_ACCESS_TOKEN=$HASHNODE_ACCESS_TOKEN
          HASHNODE_PUBLICATION_ID=$HASHNODE_PUBLICATION_ID
          MASTODON_INSTANCE=${MASTODON_INSTANCE:-https://mastodon.social}
          MASTODON_ACCESS_TOKEN=$MASTODON_ACCESS_TOKEN
          THREADS_USER_ID=$THREADS_USER_ID
          THREADS_ACCESS_TOKEN=$THREADS_ACCESS_TOKEN
          REDDIT_SESSION_COOKIE=$REDDIT_SESSION_COOKIE
          REDDIT_CLIENT_ID=$REDDIT_CLIENT_ID
          REDDIT_CLIENT_SECRET=$REDDIT_CLIENT_SECRET
          REDDIT_USERNAME=$REDDIT_USERNAME
          REDDIT_PASSWORD=$REDDIT_PASSWORD
          X_API_KEY=$X_API_KEY
          X_API_SECRET=$X_API_SECRET
          X_ACCESS_TOKEN=$X_ACCESS_TOKEN
          X_ACCESS_SECRET=$X_ACCESS_SECRET
          DRY_RUN=false
          RAS_BASE_URL=http://localhost:3000
          EOF

      - name: Upload Secrets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raaps-env
          path: raaps.env
          retention-days: 1
