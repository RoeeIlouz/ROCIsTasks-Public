name: ROCIs Tasks Marketing & Feedback Bot

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
    # Weekly Sunday traction digest (09:00 UTC)
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Verify credentials and test API connections only'
        required: false
        default: false
        type: boolean
      analytics:
        description: 'Send weekly analytics traction digest to Telegram'
        required: false
        default: false
        type: boolean
      launch_kit:
        description: 'Generate Show HN & Product Hunt Launch Kit'
        required: false
        default: false
        type: boolean
      version_tag:
        description: 'Version tag for launch kit (default: 1.0)'
        required: false
        default: '1.0'
        type: string
      dry_run:
        description: 'Run in dry-run mode (no external posting)'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [telegram-approval]

jobs:
  run-marketing-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/marketing_bot/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/marketing_bot/requirements.txt

      - name: Install Playwright Browsers
        if: ${{ !inputs.verify_only }}
        run: |
          python -m playwright install --with-deps chromium

      - name: Verify Credentials & API Connections
        if: ${{ inputs.verify_only }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_SESSION_COOKIE: ${{ secrets.REDDIT_SESSION_COOKIE }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          HASHNODE_ACCESS_TOKEN: ${{ secrets.HASHNODE_ACCESS_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          MEDIUM_INTEGRATION_TOKEN: ${{ secrets.MEDIUM_INTEGRATION_TOKEN }}
        run: |
          python -m scripts.marketing_bot.verify_credentials

      - name: Run Marketing & Feedback Engine
        if: ${{ !inputs.verify_only }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_SESSION_COOKIE: ${{ secrets.REDDIT_SESSION_COOKIE }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          HASHNODE_ACCESS_TOKEN: ${{ secrets.HASHNODE_ACCESS_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          MEDIUM_INTEGRATION_TOKEN: ${{ secrets.MEDIUM_INTEGRATION_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          DISPATCH_ACTION: ${{ github.event.client_payload.action }}
          DISPATCH_DRAFT_ID: ${{ github.event.client_payload.draft_id }}
          DISPATCH_MESSAGE_ID: ${{ github.event.client_payload.message_id }}
        run: |
          if [ "${{ inputs.analytics }}" = "true" ]; then
            python -m scripts.marketing_bot.main --analytics
          elif [ "${{ inputs.launch_kit }}" = "true" ]; then
            python -m scripts.marketing_bot.main --launch-kit --version-tag "${{ inputs.version_tag || '1.0' }}"
          elif [ "${{ github.event.schedule }}" = "0 9 * * 0" ]; then
            python -m scripts.marketing_bot.main --analytics
          else
            python -m scripts.marketing_bot.main
          fi

      - name: Commit & Push Updated State
        if: ${{ !inputs.verify_only }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Marketing Bot]"
          # Fetch latest origin to prevent non-fast-forward conflicts
          git fetch origin main
          python -c '
          import json, os
          from pathlib import Path
          sf = Path("scripts/marketing_bot/marketing_state.json")
          if not sf.exists(): exit(0)
          local = json.loads(sf.read_text(encoding="utf-8"))
          # Read remote state if available
          os.system("git show origin/main:scripts/marketing_bot/marketing_state.json > /tmp/remote_state.json 2>/dev/null")
          rf = Path("/tmp/remote_state.json")
          if rf.exists() and rf.stat().st_size > 0:
              try:
                  remote = json.loads(rf.read_text(encoding="utf-8"))
                  for k in ["inspected_threads", "pending_drafts", "posted_threads", "posted_devlogs"]:
                      if k in remote:
                          merged = dict(remote[k])
                          merged.update(local.get(k, {}))
                          local[k] = merged
                  sf.write_text(json.dumps(local, indent=2, ensure_ascii=False), encoding="utf-8")
              except Exception as e:
                  print(f"Merge error: {e}")
          '
          git add scripts/marketing_bot/marketing_state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(marketing): update marketing state [skip ci]"
            git pull --rebase -X theirs origin main || git rebase --abort
            git push origin main
          fi
