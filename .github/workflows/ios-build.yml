name: ROCIs Tasks iOS Build (unsigned IPA)

# Builds an unsigned .ipa on a macOS runner. Sign and install it from
# Windows/WSL with xtool: `xtool install rocis-tasks-unsigned.ipa`.
on:
  push:
    branches:
      - 'feat/ios-ipad'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Setup configuration templates & secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
          FIREBASE_OPTIONS_BASE64: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}
        run: python3 scripts/setup_ci_configs.py

      - name: Setup iOS Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 secret is not set"
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          python3 scripts/patch_env_ios.py

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      # xtool takes each bundle's entitlements (the widget App Group) from its
      # existing signature, so ad-hoc sign with them; xtool re-signs on install.
      - name: Ad-hoc sign with entitlements
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \;
          codesign --force --sign - --entitlements ios/RocisWidgets/RocisWidgets.entitlements "$APP/PlugIns/RocisWidgets.appex"
          codesign --force --sign - --entitlements ios/Runner/Runner.entitlements "$APP"
          codesign -d --entitlements - "$APP/PlugIns/RocisWidgets.appex"

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry rocis-tasks-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: rocis-tasks-ios-unsigned
          path: rocis-tasks-unsigned.ipa
          retention-days: 14
